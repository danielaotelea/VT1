document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0 June 2026<\u002Fdiv>\n        <\u002Fdiv>\n        \n      <\u002Fheader>\n\n      <section data-screen-label=\"Executive Summary\">\n        <h2><span class=\"num\">1<\u002Fspan> Executive Summary<\u002Fh2>\n        <p class=\"lead\">This project investigated how to make AI agents observable and debuggable using open-source tooling, and delivered a head-to-head evaluation of three platforms — <strong>Arize Phoenix<\u002Fstrong>, <strong>Langfuse<\u002Fstrong>, and <strong>Comet Opik<\u002Fstrong> — across progressively more complex agent architectures.<\u002Fp>\n        <p>Three working systems were built and instrumented end-to-end: a single <em>ReAct<\u002Fem> agent, a multi-agent research-and-fact-check pipeline running in-process, and a distributed variant of that pipeline using Google's Agent2Agent (A2A) protocol. Each system was traced through all three platforms over a controlled experiment set, five query workloads per exporter, producing directly comparable latency, cost, and trace-quality data across 15 instrumented runs.<\u002Fp>\n        <div class=\"callout\">\n          <p> Single-agent tracing is effectively a solved problem: all three tools capture reasoning steps, tool calls, and token cost with minimal integration effort and near-identical results. The real differentiation appears in multi-agent and especially distributed settings, where cross-process session correlation, semantic-convention consistency, and agent-specific quality/governance signals separate the platforms.<\u002Fp>\n        <\u002Fdiv>\n        \n      <\u002Fsection>\n\n      <section data-screen-label=\"Business Context\">\n        <h2><span class=\"num\">2<\u002Fspan>Context &amp; Motivation<\u002Fh2>\n        <p>AI agents are moving from demos into production, where they plan, call tools, and coordinate with other agents autonomously. That autonomy is exactly what makes them hard to operate: a single user request can fan out into dozens of LLM calls, tool invocations, and inter-agent messages — any of which can fail silently, hallucinate, loop, or leak sensitive data.<\u002Fp>\n        <p>Observability addresses the operational risks specific to agentic systems:<\u002Fp>\n        <ul>\n          <li><strong>Debugging<\u002Fstrong> — reconstructing <em>why<\u002Fem> an agent produced an answer requires the full reasoning trace, not just inputs and outputs.<\u002Fli>\n          <li><strong>Cost<\u002Fstrong> — token usage compounds across reasoning loops and agent roles; without per-role attribution, spend stays invisible until the bill arrives.<\u002Fli>\n          <li><strong>Quality<\u002Fstrong> — hallucination and incompleteness are silent failures that conventional monitoring never surfaces.<\u002Fli>\n          <li><strong>Safety &amp; governance<\u002Fstrong> — prompt injection, PII leakage, and runaway loops must be detected and audited.<\u002Fli>\n          <li><strong>Distributed coordination<\u002Fstrong> — once agents run as independent services, failures hide in the gaps between them.<\u002Fli>\n        <\u002Ful>\n        <p>Classic application performance monitoring was built for deterministic request/response services. It has no native concept of a reasoning trace, a tool-call span, an inter-agent message, or a hallucination score — precisely the signals agent operators need.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Objectives &amp; Scope\">\n        <h2><span class=\"num\">3<\u002Fspan> Objectives &amp; Scope<\u002Fh2>\n        <h3>Objectives<\u002Fh3>\n        <ul>\n          <li>Define what must be observed in an AI agent — a structured requirements framework.<\u002Fli>\n          <li>Survey the open-source landscape and select a representative subset for in-depth evaluation.<\u002Fli>\n          <li>Build instrumented reference agents and evaluate the selected tools against the framework.<\u002Fli>\n          <li>Derive practical guidance and a tool recommendation.<\u002Fli>\n        <\u002Ful>\n        <h3>Scope<\u002Fh3>\n        <ul>\n          <li><strong>In scope:<\u002Fstrong> three open-source platforms (Arize Phoenix, Langfuse, Comet Opik); OpenTelemetry-based instrumentation; single-agent, multi-agent in-process, and distributed (A2A) architectures; latency, cost, trace quality, session correlation, and governance signals.<\u002Fli>\n          <li><strong>Out of scope:<\u002Fstrong> production-scale load testing; proprietary/commercial platforms; multi-turn conversational workloads; security penetration testing.<\u002Fli>\n        <\u002Ful>\n        <p>The evaluation runs in two rounds plus a distributed extension: <strong style=\"width: 63px; height: 17px\">Round 1<\u002Fstrong> (single agent) → <strong>Round 2<\u002Fstrong> (multi-agent in-process) → <strong>distributed A2A<\u002Fstrong> variant — so each tool is assessed at increasing levels of complexity.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Approach &amp; Method\">\n        <h2><span class=\"num\">4<\u002Fspan> Approach &amp; Method<\u002Fh2>\n        <p><strong>Requirements framework.<\u002Fstrong> Six observability areas — reasoning traceability, multi-agent coordination, performance, quality, safety, and governance — each decomposed into concrete metrics, logs, events, and traces.<\u002Fp>\n        <p><strong>Evaluation design.<\u002Fstrong> A three-pillar framework (integration, signal coverage, usability &amp; operations) applied identically to every tool, across both rounds plus the distributed variant, so capability is compared at increasing complexity.<\u002Fp>\n        <p><strong>Workloads.<\u002Fstrong> Five fixed query workloads per exporter, run against each system — 15 experiment result sets in total (three systems × five exporters), exported as JSON with trace screenshots.<\u002Fp>\n        <p><strong>Reproducibility.<\u002Fstrong> The LLM-as-judge is fixed to temperature 0; all SDK versions are pinned; and a pluggable exporter flag isolates platform-specific code so the same agent runs unchanged across all three tools.<\u002Fp>\n        <p><strong>Instrumentation.<\u002Fstrong> OpenTelemetry spans are emitted in both OTel GenAI and OpenInference conventions; cost is attributed per LLM call; sessions are grouped per platform; and cross-process sessions are propagated via W3C Baggage in the distributed variant.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Main Results\">\n        <h2><span class=\"num\">5<\u002Fspan> Main Results<\u002Fh2>\n        <h3>5.1 Single-agent baseline<\u002Fh3>\n        <p>All three tools captured the ReAct loop's reasoning, arithmetic tool calls, and token cost out of the box, with low integration effort. End-to-end latency and cost (5-query average per session) were closely matched:<\u002Fp>\n        <table class=\"tbl\">\n          <thead><tr><th>Tool<\u002Fth><th>Latency (mean)<\u002Fth><th>Cost / session<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"tool\">Arize Phoenix<\u002Ftd><td class=\"nums\">8,536 ms<\u002Ftd><td class=\"nums\">$0.0175<\u002Ftd><\u002Ftr>\n            <tr><td class=\"tool\">Langfuse<\u002Ftd><td class=\"nums\">8,850 ms<\u002Ftd><td class=\"nums\">$0.0177<\u002Ftd><\u002Ftr>\n            <tr><td class=\"tool\">Comet Opik<\u002Ftd><td class=\"nums\">11,218 ms<\u002Ftd><td class=\"nums\">$0.0182<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n        <h3>5.2 Multi-agent in-process<\u002Fh3>\n        <p>The Orchestrator → Researcher → Evaluator pipeline produced richer traces: tool-call spans, inter-agent messages, LLM-as-judge scores (faithfulness, completeness, guardrail compliance), and four safety guards (loop detection, PII, token explosion, HITL escalation). In-process session grouping held across all three tools.<\u002Fp>\n        <h3>5.3 Distributed A2A<\u002Fh3>\n        <p>Researcher and Evaluator run as independent A2A JSON-RPC services; the orchestrator calls them over HTTP. Genuine cross-process span correlation required W3C context propagation (<em>traceparent<\u002Fem> + <em>session.id<\u002Fem> promoted into Baggage). This is where the tools diverged most.<\u002Fp>\n        <h3>5.4 Cross-tool comparison<\u002Fh3>\n        <table class=\"tbl\">\n          <thead><tr><th>Tool<\u002Fth><th>Strengths<\u002Fth><th>Weaknesses<\u002Fth><th>Best fit<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr>\n              <td class=\"tool\">Arize Phoenix<\u002Ftd>\n              <td>OTel/OpenInference-native; automatic LangChain instrumentation; lowest measured latency; mature default dashboards and UI filtering options; powerful API.<\u002Ftd>\n              <td>Hard to debug and filter JSON-RPC calls in Agent2Agent setups; no visual representation for LangGraph states.<\u002Ftd>\n              <td>Any environment — aligns closely with OpenInference and backed by an active GitHub community.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td class=\"tool\">Langfuse<\u002Ftd>\n              <td>ClickHouse-backed; strong session views and evaluation UI; mature dashboards.<\u002Ftd>\n              <td>Requires managing multiple resources (ClickHouse, MinIO, PostgreSQL); generates a high volume of traces per session.<\u002Ftd>\n              <td>Mature teams and production-grade environments.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td class=\"tool\">Comet Opik<\u002Ftd>\n              <td>Native <em>thread_id<\u002Fem> sessions; distributed-tracing support via trace-id headers.<\u002Ftd>\n              <td>Highest measured latency; distributed tracing only conditionally active; UI is less mature.<\u002Ftd>\n              <td>Local development for data scientists and ML practitioners.<\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n        <h3>5.5 What worked, what didn't<\u002Fh3>\n        <p><strong>Worked:<\u002Fstrong> OTel-based portability let the same agent run unchanged across all three tools; per-call cost attribution; in-process session grouping. <br><strong>Didn't:<\u002Fstrong> fully portable distributed correlation; consistent semantic conventions across tools; quality and governance measurement are still evolving and often require custom instrumentation or evaluation workflows.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Key Insights\">\n        <h2><span class=\"num\">6<\u002Fspan> Key Insights<\u002Fh2>\n        <ul>\n          <li>Single-agent tracing is relatively easy and well-supported across all three tools.<\u002Fli>\n          <li>Multi-agent and distributed setups create the real differentiation between platforms.<\u002Fli>\n          <li>Open standards (OpenTelemetry) materially help portability, but tool-specific attributes and conventions still matter.<\u002Fli>\n          <li>Cross-process session propagation (W3C Baggage) is critical — and not equally supported.<\u002Fli>\n          <li>Quality and governance metrics remain immature in current tooling and largely require custom instrumentation.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Risks &amp; Limitations\">\n        <h2><span class=\"num\">7<\u002Fspan> Risks, Limitations &amp; Assumptions<\u002Fh2>\n        <ul>\n          <li>Tools differ in semantic conventions (OTel GenAI vs OpenInference), so traces are not always directly comparable.<\u002Fli>\n          <li>Several agent-specific signals (hallucination, guardrail compliance) required custom instrumentation rather than native support.<\u002Fli>\n          <li>Distributed trace correlation is not equally portable across the three tools.<\u002Fli>\n          <li>Results come from a controlled experimental setup (fixed queries, local Docker), not production traffic.<\u002Fli>\n          <li>LLM non-determinism can affect individual runs; mitigated by temperature 0 and fixed workloads, but not eliminated.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Recommendation\">\n        <h2><span class=\"num\">8<\u002Fspan> Recommendation<\u002Fh2>\n        <p>Based on the evaluation, the recommended tool selection per use case:<\u002Fp>\n        <ul class=\"kv\">\n          <li><b>Default for development / debugging: Arize Phoenix<\u002Fb> <\u002Fli>\n          <li><b>Production governance / compliance: Arize Phoenix<\u002Fb> <\u002Fli>\n          <li><b>LangGraph-heavy workflows: Langfuse<\u002Fb> <\u002Fli>\n          <li><b>When a hybrid approach makes sense: Arize Phoenix<\u002Fb> <\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Next Steps\">\n        <h2><span class=\"num\">9<\u002Fspan> Next Steps<\u002Fh2>\n        <ul>\n          <li>Standardise agent identifiers and span attributes across tools.<\u002Fli>\n          <li>Add native quality and safety metrics (hallucination, guardrail compliance) rather than relying on custom instrumentation.<\u002Fli>\n          <li>Expand testing to multi-turn conversations.<\u002Fli>\n          <li>Validate in a production-like environment with real traffic.<\u002Fli>\n          <li>Refine dashboards and alerting — channels, triggers, and tiers.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Conclusion\">\n        <h2><span class=\"num\">10<\u002Fspan> Conclusion<\u002Fh2>\n        <p>The project delivered a working, reproducible comparison of three open-source observability platforms across single-agent, multi-agent, and distributed architectures, backed by instrumented experiment runs and a full requirements framework. The defined objectives were met.<\u002Fp>\n        <p>The practical contribution is evidence-based view of where today's open-source agent-observability tooling is strong (single-agent tracing, cost attribution, OTel portability) and where it still falls short: distributed correlation and evolving quality and governance signals implementation.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-screen-label=\"Appendix\">\n        <h2><span class=\"num\">11<\u002Fspan> Appendix<\u002Fh2>\n        <h3>A · Experiment setup<\u002Fh3>\n        <p>3 systems × 5 exporters × 5 query workloads = 15 instrumented run sets (JSON + screenshots). Pinned SDKs: <em>arize-phoenix ≥ 4.0.0, langfuse ≥ 4.12.0, opik ≥ 2.1.4, a2a-sdk 1.1.0<\u002Fem>.<\u002Fp>\n        \n        \n        <h3>B · Glossary<\u002Fh3>\n        <p><strong>ReAct<\u002Fstrong> reasoning-and-acting loop · <strong>span / trace<\u002Fstrong> unit / tree of instrumented work · <strong>OTel<\u002Fstrong> OpenTelemetry · <strong>OpenInference<\u002Fstrong> LLM-specific span convention · <strong>A2A<\u002Fstrong> Agent2Agent protocol · <strong>HITL<\u002Fstrong> human-in-the-loop · <strong>W3C Baggage<\u002Fstrong> cross-process context propagation · <strong>LLM-as-judge<\u002Fstrong> model-scored evaluation.<\u002Fp>\n        <h3>C · References<\u002Fh3>\n        <p>Full reference list in the technical final report.<\u002Fp>\n      <\u002Fsection>\n\n      \n\n    <\u002Ftd><\u002Ftr><\u002Ftbody>\n    <tfoot><tr><td class=\"pad-bottom\"><\u002Ftd><\u002Ftr><\u002Ftfoot>\n  <\u002Ftable>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 880, &quot;height&quot;: 1180 },\n  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#145c63&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Style&quot;, &quot;options&quot;: [&quot;#145c63&quot;, &quot;#1f4e79&quot;, &quot;#7a3b2e&quot;, &quot;#2d3a2e&quot;] },\n  &quot;highlightGaps&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Authoring&quot; }\n}\">\nclass Component extends DCLogic {\n  ren
